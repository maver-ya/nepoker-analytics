name: Обновление межсезонки
on:
  schedule:
    - cron: '0 6 * * *'   # каждый день в 06:00 UTC (09:00 по Москве)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Установка зависимостей
        run: pip install openpyxl
      - name: Обновление данных
        run: python update_site.py
      - name: Коммит, если данные изменились
        run: |
          git config user.name "nepoker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data interseason
          git diff --cached --quiet || (git commit -m "Автообновление межсезонки" && git push)
